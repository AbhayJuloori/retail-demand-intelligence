services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install -r /app/requirements.txt -q && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LLM_PROVIDER: groq
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    depends_on: []

  mlflow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install mlflow -q && mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db"
    ports:
      - "5000:5000"
    env_file:
      - .env
